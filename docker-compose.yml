services:
  control-api:
    build:
      context: .
      dockerfile: apps/control-api/Dockerfile
    environment:
      PORT: 4000
      CONTROL_DATA_ROOT: ${CONTROL_DATA_ROOT}
      CONTROL_DB_PATH: ${CONTROL_DB_PATH:-/data/control/control-api.sqlite}
      CONTROL_BOOTSTRAP_FROM_JSON: ${CONTROL_BOOTSTRAP_FROM_JSON:-true}
      ENABLE_QPS_TOOLKIT: ${ENABLE_QPS_TOOLKIT}
      MCP_QPS_TOOLKIT_URL: http://mcp-qps-toolkit:7050/mcp
      MCP_TIMEOUT_MS: ${MCP_TIMEOUT_MS:-15000}
      SEED_DEMO_CONTENT: ${SEED_DEMO_CONTENT}
      MCP_SERVERS_JSON: >
        [{"name":"mcp-playwright","url":"http://mcp-playwright:7010/mcp"},{"name":"mcp-markitdown","url":"http://mcp-markitdown:7020/mcp"},{"name":"mcp-textops","url":"http://mcp-textops:7030/mcp"},{"name":"mcp-assets","url":"http://mcp-assets:7040/mcp"}]
    ports:
      - "${CONTROL_API_PORT}:4000"
    volumes:
      - control-data:${CONTROL_DATA_ROOT}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage-api:
    build:
      context: .
      dockerfile: apps/storage-api/Dockerfile
    environment:
      PORT: 4100
      STORAGE_ROOT: ${STORAGE_ROOT}
      SEED_DEMO_CONTENT: ${SEED_DEMO_CONTENT}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    ports:
      - "${STORAGE_API_PORT}:4100"
    volumes:
      - storage-data:${STORAGE_ROOT}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-ui:
    build:
      context: .
      dockerfile: apps/admin-ui/Dockerfile
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      CONTROL_API_URL: http://control-api:4000
      STORAGE_API_URL: http://storage-api:4100
      ASSETS_API_URL: http://mcp-assets:7040
      QPS_TOOLKIT_API_URL: http://mcp-qps-toolkit:7050
      ENABLE_QPS_TOOLKIT: ${ENABLE_QPS_TOOLKIT}
    ports:
      - "${ADMIN_UI_PORT}:3000"
    depends_on:
      - control-api
      - storage-api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-textops:
    build:
      context: .
      dockerfile: servers/mcp-textops/Dockerfile
    environment:
      PORT: 7030
    ports:
      - "${MCP_TEXTOPS_PORT}:7030"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7030/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-assets:
    build:
      context: .
      dockerfile: servers/mcp-assets/Dockerfile
    environment:
      PORT: 7040
      ASSETS_ROOT: ${ASSETS_ROOT}
      QPS_ASSETS_ROOT: /qps-toolkit/plugin/shared/assets
      IMPORT_QPS_ASSETS_ON_START: ${IMPORT_QPS_ASSETS_ON_START:-false}
      SEED_DEMO_CONTENT: ${SEED_DEMO_CONTENT}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    ports:
      - "${MCP_ASSETS_PORT}:7040"
    volumes:
      - assets-data:${ASSETS_ROOT}
      - type: bind
        source: ${QPS_TOOLKIT_ROOT:-./local/qps-toolkit}
        target: /qps-toolkit
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7040/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-playwright:
    build:
      context: .
      dockerfile: servers/mcp-playwright/Dockerfile
    environment:
      PORT: 7010
      STORAGE_ROOT: ${STORAGE_ROOT}
      PLAYWRIGHT_ALLOWED_ORIGINS: ${PLAYWRIGHT_ALLOWED_ORIGINS:-https://example.com}
      PLAYWRIGHT_BLOCK_PRIVATE_NETWORKS: ${PLAYWRIGHT_BLOCK_PRIVATE_NETWORKS:-true}
      PLAYWRIGHT_TIMEOUT_MS: ${PLAYWRIGHT_TIMEOUT_MS:-15000}
    ports:
      - "${MCP_PLAYWRIGHT_PORT}:7010"
    volumes:
      - storage-data:${STORAGE_ROOT}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-markitdown:
    build:
      context: .
      dockerfile: servers/mcp-markitdown/Dockerfile
    environment:
      PORT: 7020
      STORAGE_ROOT: ${STORAGE_ROOT}
      MARKITDOWN_DISABLE_DNS_REBINDING_PROTECTION: ${MARKITDOWN_DISABLE_DNS_REBINDING_PROTECTION:-false}
      MARKITDOWN_ALLOWED_HOSTS: ${MARKITDOWN_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,mcp-markitdown:*}
      MAX_MARKITDOWN_INPUT_BYTES: ${MAX_MARKITDOWN_INPUT_BYTES:-10485760}
    ports:
      - "${MCP_MARKITDOWN_PORT}:7020"
    volumes:
      - storage-data:${STORAGE_ROOT}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7020/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-qps-toolkit:
    profiles: ["qps"]
    build:
      context: .
      dockerfile: servers/mcp-qps-toolkit/Dockerfile
    environment:
      PORT: 7050
      QPS_TOOLKIT_PLUGIN_ROOT: /qps-toolkit/plugin
      MANAGED_ASSETS_ROOT: ${ASSETS_ROOT}
      QPS_TOOLKIT_WRITE_MODE: ${QPS_TOOLKIT_WRITE_MODE:-read-only}
    ports:
      - "${MCP_QPS_TOOLKIT_PORT}:7050"
    depends_on:
      - mcp-assets
    volumes:
      - assets-data:${ASSETS_ROOT}
      - type: bind
        source: ${QPS_TOOLKIT_ROOT:-./local/qps-toolkit}
        target: /qps-toolkit
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7050/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  storage-data:
  assets-data:
  control-data:
